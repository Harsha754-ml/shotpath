<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="600" height="200" rx="16" fill="url(#bg)"/>

  <!-- Clipboard icon -->
  <g transform="translate(60, 50)">
    <rect x="15" y="20" width="50" height="65" rx="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <rect x="25" y="10" width="30" height="15" rx="3" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="40" cy="17" r="3" fill="#00d4ff"/>
    <path d="M25 45 L55 45 M25 55 L45 55 M25 65 L50 65" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(170, 80)">
    <path d="M0 20 L40 20 M30 10 L40 20 L30 30" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Folder icon -->
  <g transform="translate(220, 55)">
    <path d="M0 15 L0 75 L70 75 L70 25 L45 25 L35 15 Z" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
    <path d="M35 15 L35 25 L45 25" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="35" cy="50" r="12" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M30 50 L35 55 L45 45" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="310" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff">ShotPath</text>
  <text x="310" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8892b0">Smart clipboard for screenshot folders</text>

  <!-- Tagline bar -->
  <rect x="310" y="120" width="260" height="28" rx="4" fill="url(#accent)" opacity="0.15"/>
  <text x="325" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#00d4ff">⚡ Real-time • 🎯 Multi-format • 🔒 Secure</text>

  <!-- Decorative dots -->
  <circle cx="550" cy="40" r="3" fill="#7c3aed" opacity="0.6"/>
  <circle cx="570" cy="55" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="555" cy="165" r="4" fill="#7c3aed" opacity="0.3"/>
  <circle cx="540" cy="150" r="2" fill="#00d4ff" opacity="0.5"/>
</svg>
