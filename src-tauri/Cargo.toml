[package]
name = "shotpath"
version = "0.1.0"
edition = "2021"

[lib]
name = "shotpath_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1.1"
arboard = "3.3.0"
image = "0.24.9"
clipboard-win = "5.4.1"
dirs = "5"
